<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Enter the Public Pilot Library and contribute</title>
  <desc id="desc">Read the visual library and maintained specification, choose one question, comment with public-safe evidence, and follow the attributable review outcome.</desc>
  <rect width="1200" height="420" rx="28" fill="#10152c"/>
  <text x="60" y="66" fill="#f7f2e8" font-family="Arial, sans-serif" font-size="32" font-weight="700">Enter the Public Pilot Library</text>
  <text x="60" y="102" fill="#aeb8d6" font-family="Arial, sans-serif" font-size="19">You do not need an M5 account, credential, investment, or private record to review the proposal</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="65" y="165" width="230" height="120" rx="18" fill="#f7f2e8"/>
    <text x="180" y="210" fill="#10152c" font-size="20" font-weight="700">1 READ</text><text x="180" y="245" fill="#39405c" font-size="16">visuals + source text</text>
    <rect x="345" y="165" width="230" height="120" rx="18" fill="#28a9a1"/>
    <text x="460" y="210" fill="#071e24" font-size="20" font-weight="700">2 CHOOSE</text><text x="460" y="245" fill="#071e24" font-size="16">one bounded question</text>
    <rect x="625" y="165" width="230" height="120" rx="18" fill="#f7f2e8"/>
    <text x="740" y="210" fill="#10152c" font-size="20" font-weight="700">3 CONTRIBUTE</text><text x="740" y="245" fill="#39405c" font-size="16">evidence, risk, or test</text>
    <rect x="905" y="165" width="230" height="120" rx="18" fill="#d5a84b"/>
    <text x="1020" y="210" fill="#10152c" font-size="20" font-weight="700">4 FOLLOW</text><text x="1020" y="245" fill="#10152c" font-size="16">decision + change record</text>
  </g>
  <text x="600" y="345" text-anchor="middle" fill="#f7f2e8" font-family="Arial, sans-serif" font-size="20" font-weight="700">github.com/TitleChain-Foundation/M5-AI-Sovereign-Commons/discussions/1</text>
  <text x="600" y="378" text-anchor="middle" fill="#d5a84b" font-family="Arial, sans-serif" font-size="17">Public review is not an SEC submission, offering, membership, or promise of compensation</text>
</svg>
