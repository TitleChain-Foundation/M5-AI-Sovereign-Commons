<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Authority before execution</title>
  <desc id="desc">External status, accountable parties, credentials, restrictions, approval, deterministic evaluation, and evidence precede or follow bounded execution in order.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d5a84b"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#10152c"/>
  <text x="60" y="62" fill="#f7f2e8" font-family="Arial, sans-serif" font-size="30" font-weight="700">Classification and authority before execution</text>
  <text x="60" y="96" fill="#aeb8d6" font-family="Arial, sans-serif" font-size="18">A wallet, key, credential, token, or agent does not create permission</text>

  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    <rect x="45" y="155" width="150" height="120" rx="16" fill="#f7f2e8"/>
    <text x="120" y="195" fill="#10152c" font-weight="700">EXTERNAL</text>
    <text x="120" y="219" fill="#39405c">legal and</text>
    <text x="120" y="242" fill="#39405c">regulatory status</text>

    <rect x="235" y="155" width="150" height="120" rx="16" fill="#28a9a1"/>
    <text x="310" y="195" fill="#071e24" font-weight="700">ACCOUNTABLE</text>
    <text x="310" y="219" fill="#071e24">entity and</text>
    <text x="310" y="242" fill="#071e24">human</text>

    <rect x="425" y="155" width="150" height="120" rx="16" fill="#f7f2e8"/>
    <text x="500" y="195" fill="#10152c" font-weight="700">CURRENT</text>
    <text x="500" y="219" fill="#39405c">role, credential,</text>
    <text x="500" y="242" fill="#39405c">and delegation</text>

    <rect x="615" y="155" width="150" height="120" rx="16" fill="#28a9a1"/>
    <text x="690" y="195" fill="#071e24" font-weight="700">RESTRICTION</text>
    <text x="690" y="219" fill="#071e24">instrument, holder,</text>
    <text x="690" y="242" fill="#071e24">and jurisdiction</text>

    <rect x="805" y="155" width="150" height="120" rx="16" fill="#d5a84b"/>
    <text x="880" y="195" fill="#10152c" font-weight="700">M5CANON</text>
    <text x="880" y="219" fill="#10152c">required approval</text>
    <text x="880" y="242" fill="#10152c">ALLOW or DENY</text>

    <rect x="995" y="155" width="160" height="120" rx="16" fill="#f7f2e8"/>
    <text x="1075" y="195" fill="#10152c" font-weight="700">BOUNDED</text>
    <text x="1075" y="219" fill="#39405c">execution and</text>
    <text x="1075" y="242" fill="#39405c">evidence receipt</text>

    <path d="M195 215 H225 M385 215 H415 M575 215 H605 M765 215 H795 M955 215 H985" stroke="#d5a84b" stroke-width="5" marker-end="url(#arrow)"/>
  </g>
  <rect x="165" y="325" width="870" height="50" rx="14" fill="#232b50"/>
  <text x="600" y="358" text-anchor="middle" fill="#f7f2e8" font-family="Arial, sans-serif" font-size="18">Missing, stale, revoked, disputed, contradictory, or out-of-scope evidence: DENY or unresolved</text>
</svg>
