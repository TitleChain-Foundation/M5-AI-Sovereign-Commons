<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Conformance and failure testing</title>
  <desc id="desc">Large-format card showing the unsafe conditions the pilot must deny and the correction, recovery, evidence, and portability capabilities it must demonstrate.</desc>
  <rect width="1080" height="1350" fill="#fffdf9"/>
  <rect x="48" y="48" width="984" height="1254" fill="none" stroke="#d8d0c2" stroke-width="2"/>

  <text x="95" y="125" fill="#9c7b26" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5">CONFORMANCE TESTS</text>
  <text x="95" y="220" fill="#211627" font-family="Georgia, 'Times New Roman', serif" font-size="62">The proof is whether</text>
  <text x="95" y="292" fill="#211627" font-family="Georgia, 'Times New Roman', serif" font-size="62">unsafe action stops.</text>
  <line x1="95" y1="332" x2="255" y2="332" stroke="#d53679" stroke-width="5"/>
  <text x="95" y="400" fill="#4c4650" font-family="Arial, sans-serif" font-size="25">A successful pilot includes denials, correction,</text>
  <text x="95" y="436" fill="#4c4650" font-family="Arial, sans-serif" font-size="25">recovery, evidence, and successor continuity.</text>

  <rect x="85" y="495" width="910" height="330" rx="12" fill="#211627"/>
  <text x="125" y="555" fill="#c7a552" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">MUST DENY OR RESOLVE</text>
  <text x="125" y="620" fill="#fffdf9" font-family="Arial, sans-serif" font-size="29">Wrong signer or expired delegation</text>
  <text x="125" y="675" fill="#fffdf9" font-family="Arial, sans-serif" font-size="29">Rights collapsed into one token or wallet</text>
  <text x="125" y="730" fill="#fffdf9" font-family="Arial, sans-serif" font-size="29">Missing regulated role or holder restriction</text>
  <text x="125" y="785" fill="#fffdf9" font-family="Arial, sans-serif" font-size="29">Conflicting authoritative and linked records</text>

  <rect x="85" y="855" width="910" height="300" rx="12" fill="#f1ece4" stroke="#d8d0c2"/>
  <text x="125" y="915" fill="#7c2c62" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">MUST DEMONSTRATE</text>
  <text x="125" y="980" fill="#211627" font-family="Arial, sans-serif" font-size="29">Attributable allow and deny receipts</text>
  <text x="125" y="1035" fill="#211627" font-family="Arial, sans-serif" font-size="29">Correction without erasing history</text>
  <text x="125" y="1090" fill="#211627" font-family="Arial, sans-serif" font-size="29">Recovery without expanding authority</text>
  <text x="125" y="1145" fill="#211627" font-family="Arial, sans-serif" font-size="29">Export to an authorized successor</text>

  <rect x="85" y="1205" width="910" height="65" rx="8" fill="#c7a552"/>
  <text x="540" y="1234" text-anchor="middle" fill="#211627" font-family="Arial, sans-serif" font-size="20" font-weight="700">A TEST PASS IS EVIDENCE FOR THAT TEST.</text>
  <text x="540" y="1258" text-anchor="middle" fill="#211627" font-family="Arial, sans-serif" font-size="18">It is not certification or legal approval.</text>
</svg>
