<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Evidence and claim states</title>
  <desc id="desc">Public claims progress from synthetic and proposed through verified source, review, authorization, and active status, with correction and do-not-publish controls.</desc>
  <rect width="1200" height="520" rx="28" fill="#10152c"/>
  <text x="60" y="66" fill="#f7f2e8" font-family="Arial, sans-serif" font-size="32" font-weight="700">Every public claim carries a state</text>
  <text x="60" y="102" fill="#aeb8d6" font-family="Arial, sans-serif" font-size="19">A label records evidence maturity; it does not manufacture authority</text>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <g fill="#f7f2e8"><rect x="65" y="155" width="200" height="80" rx="15"/><rect x="285" y="155" width="200" height="80" rx="15"/><rect x="505" y="155" width="200" height="80" rx="15"/><rect x="725" y="155" width="200" height="80" rx="15"/><rect x="945" y="155" width="190" height="80" rx="15"/></g>
    <g fill="#10152c"><text x="165" y="205">SYNTHETIC</text><text x="385" y="205">PROPOSED</text><text x="605" y="205">UNVERIFIED LEAD</text><text x="825" y="205">VERIFIED SOURCE</text><text x="1040" y="205">UNDER REVIEW</text></g>
    <g fill="#28a9a1"><rect x="175" y="275" width="250" height="80" rx="15"/><rect x="475" y="275" width="250" height="80" rx="15"/><rect x="775" y="275" width="250" height="80" rx="15"/></g>
    <g fill="#071e24"><text x="300" y="325">AUTHORIZED</text><text x="600" y="325">ACTIVE</text><text x="900" y="325">CORRECTED / SUPERSEDED</text></g>
  </g>
  <rect x="165" y="405" width="870" height="60" rx="15" fill="#d5a84b"/>
  <text x="600" y="443" text-anchor="middle" fill="#10152c" font-family="Arial, sans-serif" font-size="18" font-weight="700">DO NOT PUBLISH: private, privileged, personal, security-sensitive, or unsupported</text>
</svg>
