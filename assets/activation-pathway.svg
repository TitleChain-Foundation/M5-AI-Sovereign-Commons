<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Public activation and capability pathway</title>
  <desc id="desc">The two live public actions are setting up an IAM account at M5Bank and reserving an M5POD place on the waitlist. Later M5-CV, Commons, and pilot participation require separate controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211627"/>
      <stop offset="1" stop-color="#321b38"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d53679"/>
    </marker>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <text x="60" y="64" fill="#fffdf9" font-family="Georgia, serif" font-size="34" font-weight="700">Two live starting actions. Later stages stay controlled.</text>
  <text x="60" y="100" fill="#d8cbd8" font-family="Arial, sans-serif" font-size="19">Set up IAM at M5Bank · reserve an M5POD place · do not imply automatic enrollment or project rights.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="35" y="165" width="190" height="145" rx="18" fill="#fffdf9"/>
    <text x="130" y="207" fill="#211627" font-size="18" font-weight="700">IAM</text>
    <text x="130" y="242" fill="#4c4650" font-size="15">free account origin</text>
    <text x="130" y="267" fill="#4c4650" font-size="15">m5bank.app</text>

    <rect x="270" y="165" width="190" height="145" rx="18" fill="#c7a552"/>
    <text x="365" y="207" fill="#211627" font-size="18" font-weight="700">WAITLIST</text>
    <text x="365" y="242" fill="#211627" font-size="15">reserve your M5POD</text>
    <text x="365" y="267" fill="#211627" font-size="15">pending activation</text>

    <rect x="505" y="165" width="190" height="145" rx="18" fill="#fffdf9"/>
    <text x="600" y="207" fill="#211627" font-size="18" font-weight="700">M5-CV</text>
    <text x="600" y="242" fill="#4c4650" font-size="15">capability record</text>
    <text x="600" y="267" fill="#4c4650" font-size="15">human controlled</text>

    <rect x="740" y="165" width="190" height="145" rx="18" fill="#f7f4ee"/>
    <text x="835" y="207" fill="#211627" font-size="18" font-weight="700">COMMONS</text>
    <text x="835" y="242" fill="#4c4650" font-size="15">learn + review</text>
    <text x="835" y="267" fill="#4c4650" font-size="15">build + contribute</text>

    <rect x="975" y="165" width="190" height="145" rx="18" fill="#c7a552"/>
    <text x="1070" y="207" fill="#211627" font-size="18" font-weight="700">PILOTS</text>
    <text x="1070" y="242" fill="#211627" font-size="15">bounded workflows</text>
    <text x="1070" y="267" fill="#211627" font-size="15">separate admission</text>

    <path d="M225 237 H260 M460 237 H495 M695 237 H730 M930 237 H965" stroke="#d53679" stroke-width="5" marker-end="url(#arrow)"/>
  </g>
  <rect x="105" y="365" width="990" height="75" rx="16" fill="#4a1f3d"/>
  <text x="600" y="397" text-anchor="middle" fill="#fffdf9" font-family="Arial, sans-serif" font-size="17">IAM ACCOUNT != WAITLIST PLACE != CONTROLLED ENROLLMENT != PROJECT ADMISSION</text>
  <text x="600" y="424" text-anchor="middle" fill="#d8cbd8" font-family="Arial, sans-serif" font-size="15">People's Trust currently uses sample data and creates no ownership, title, vote, membership, investment, or economic right.</text>
</svg>
