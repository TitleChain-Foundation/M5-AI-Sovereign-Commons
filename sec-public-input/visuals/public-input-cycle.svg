<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">SEC public input review cycle</title>
  <desc id="desc">Official public input moves through source capture, human review, categorized insights, conformance work, and recorded outcomes.</desc>
  <style>
    text { font-family: Arial, sans-serif; } text[font-size="30"], text[font-size="32"], text[font-size="34"] { font-family: Georgia, "Times New Roman", serif; }
    [fill="#10152c"] { fill: #211627; } [fill="#28a9a1"] { fill: #f7f4ee; } [fill="#071e24"] { fill: #211627; } [fill="#39405c"] { fill: #4c4650; }
    [fill="#aeb8d6"] { fill: #d8cbd8; } [fill="#232b50"] { fill: #321b38; } [fill="#d5a84b"] { fill: #c7a552; } [fill="#f7f2e8"] { fill: #fffdf9; } [stroke="#d5a84b"] { stroke: #d53679; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d5a84b"/>
    </marker>
  </defs>
  <rect width="1200" height="460" rx="28" fill="#10152c"/>
  <text x="60" y="66" fill="#f7f2e8" font-family="Arial, sans-serif" font-size="32" font-weight="700">From public comment to actionable review</text>
  <text x="60" y="102" fill="#aeb8d6" font-family="Arial, sans-serif" font-size="19">Official source and human approval remain visible at every publication step</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="45" y="165" width="185" height="145" rx="18" fill="#f7f2e8"/>
    <text x="138" y="207" fill="#10152c" font-size="19" font-weight="700">OFFICIAL SOURCE</text>
    <text x="138" y="242" fill="#39405c" font-size="16">URL, retrieval time,</text>
    <text x="138" y="268" fill="#39405c" font-size="16">identifier, and hash</text>

    <rect x="275" y="165" width="185" height="145" rx="18" fill="#28a9a1"/>
    <text x="368" y="207" fill="#071e24" font-size="19" font-weight="700">HUMAN REVIEW</text>
    <text x="368" y="242" fill="#071e24" font-size="16">source binding, context,</text>
    <text x="368" y="268" fill="#071e24" font-size="16">and approval state</text>

    <rect x="505" y="165" width="185" height="145" rx="18" fill="#f7f2e8"/>
    <text x="598" y="207" fill="#10152c" font-size="19" font-weight="700">INSIGHTS</text>
    <text x="598" y="242" fill="#39405c" font-size="16">ideas, risks, questions,</text>
    <text x="598" y="268" fill="#39405c" font-size="16">and controlled categories</text>

    <rect x="735" y="165" width="185" height="145" rx="18" fill="#28a9a1"/>
    <text x="828" y="207" fill="#071e24" font-size="19" font-weight="700">ACTION</text>
    <text x="828" y="242" fill="#071e24" font-size="16">Issue, test, evidence,</text>
    <text x="828" y="268" fill="#071e24" font-size="16">or proposed revision</text>

    <rect x="965" y="165" width="190" height="145" rx="18" fill="#d5a84b"/>
    <text x="1060" y="207" fill="#10152c" font-size="19" font-weight="700">OUTCOME</text>
    <text x="1060" y="242" fill="#10152c" font-size="16">accepted, revised,</text>
    <text x="1060" y="268" fill="#10152c" font-size="16">rejected, or unresolved</text>

    <path d="M230 238 H265 M460 238 H495 M690 238 H725 M920 238 H955" stroke="#d5a84b" stroke-width="5" marker-end="url(#arrow)"/>
  </g>
  <rect x="170" y="356" width="860" height="52" rx="14" fill="#232b50"/>
  <text x="600" y="389" text-anchor="middle" fill="#f7f2e8" font-family="Arial, sans-serif" font-size="18">Independent research - not an SEC position - official docket controls</text>
</svg>
