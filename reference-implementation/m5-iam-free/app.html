<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M5 IAM</title>
<style>
:root{
  --ink:#1C1917; --paper:#F5F5F4; --white:#fff; --line:#E7E5E4; --line2:#D6D3D1;
  --muted:#78716C; --label:#A8A29E; --body:#57534E;
  --rose:#E11D48; --emerald:#047857; --emerald-soft:#ECFDF5; --emerald-line:#A7F3D0;
  --serif:'Playfair Display','Didot','Bodoni 72',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
button,input,select{font:inherit;color:inherit}
.bar{background:var(--white);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:baseline;gap:8px}
.logo{font-family:var(--serif);font-size:22px}
.sub{font-size:11px;letter-spacing:.2em;color:var(--label);text-transform:uppercase}
.strip{background:var(--ink);color:var(--white);text-align:center;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:9px 16px}
main{max-width:860px;margin:0 auto;padding:36px 16px 72px;display:flex;flex-direction:column;gap:26px}
.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--label);text-transform:uppercase}
h1{font-family:var(--serif);font-weight:400;font-size:46px;line-height:1.06;margin:6px 0 10px;letter-spacing:-.01em}
h1 em{color:var(--rose)}
h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.15;margin:0 0 4px}
.lede{font-size:17px;color:var(--body);max-width:60ch;margin:0}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
label small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--label)}
input[type=text],select{width:100%;border:1px solid var(--line2);border-radius:9999px;padding:11px 16px;background:var(--white)}
input[type=text]:focus,select:focus{outline:2px solid var(--ink);outline-offset:1px}
.terms{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:16px 18px;font-size:15px;color:var(--body);white-space:pre-wrap}
.terms b{display:block;font-family:var(--serif);font-weight:400;font-size:20px;color:var(--ink);margin-bottom:6px}
.attest{display:flex;gap:12px;align-items:flex-start;margin-top:18px;font-size:17px;font-weight:600}
.attest input{width:22px;height:22px;margin-top:2px;accent-color:var(--ink);flex:none}
.btn{margin-top:18px;border:0;border-radius:9999px;background:var(--ink);color:var(--white);padding:13px 26px;font-weight:600;cursor:pointer}
.btn:disabled{background:var(--line2);cursor:not-allowed}
.error{color:var(--rose);font-size:14px;margin:10px 0 0}

.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line2);border-radius:9999px;padding:4px 12px;color:var(--muted);background:var(--white);margin:0 6px 6px 0}
.pill.on{border-color:var(--emerald-line);background:var(--emerald-soft);color:var(--emerald)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.cell{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--white);min-width:0}
.cell .k{font-size:10px;font-weight:600;letter-spacing:.18em;color:var(--label);text-transform:uppercase}
.cell .v{font-weight:600;overflow-wrap:anywhere}
.cell .n{font-size:12px;color:var(--label)}
.row{display:flex;gap:12px;align-items:baseline;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{font-weight:600}
.row span{color:var(--muted);font-size:14px}
.row .r{flex:none;text-align:right;font-size:13px;color:var(--label)}
.row a{color:var(--ink);font-weight:600}
.group{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin:18px 0 2px}
.acct{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.acct:first-of-type{border-top:0}
.tier{flex:none;width:44px;height:44px;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--muted)}
.chaincard{background:var(--ink);color:var(--white);border-color:var(--ink)}
.chaincard .note{color:#D6D3D1}
.chaincard .cell{background:#292524;border-color:#44403C}
.chaincard .cell .v{color:var(--white)}
.chaincard .group{color:#FDA4AF}
.chaintop{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pill.pending{border-color:#FCD34D;background:#FFFBEB;color:#92400E;margin:0}
.pill.sample{background:#292524;border-color:#57534E;color:#FDE68A;margin:0}
.hash{color:#A7F3D0;font-size:13px;padding:10px 12px;border:1px solid #44403C;border-radius:10px;margin-top:6px}
.note{font-size:13px;color:var(--muted);margin:12px 0 0}
ul{margin:8px 0 0;padding-left:20px;color:var(--body)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--label);overflow-wrap:anywhere}
footer{font-size:12px;color:var(--label)}
@media (max-width:560px){h1{font-size:34px}.row{flex-direction:column;gap:2px}.row .r{text-align:left}}

.certwrap{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:12px}
.certframe{padding:9px;background:repeating-linear-gradient(45deg,var(--accent,#1C1917) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,#1C1917 0 1px,transparent 1px 7px);border-radius:8px}
.cert{background:#FBF9F6;border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:-8px;padding:34px 36px;display:flex;flex-direction:column;gap:20px;color:var(--ink)}
.certhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:14px}
.certorg{font-size:11px;font-weight:700;letter-spacing:.26em}
.certorg span{display:block;color:var(--muted);letter-spacing:.14em;font-weight:600}
.stamp{transform:rotate(-6deg);border:3px solid var(--rose);color:var(--rose);padding:5px 12px;text-align:center}
.stamp b{display:block;font-size:15px;letter-spacing:.2em}
.stamp span{font-size:9px;font-weight:700;letter-spacing:.14em;white-space:nowrap}
.titleno{text-align:right}.titleno div{font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--muted)}.titleno b{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.certmid{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.certkind{font-size:13px;font-weight:700;letter-spacing:.4em}
.certbar{width:64px;height:4px;background:var(--accent,#1C1917)}
.certby{font-size:14px;color:var(--body)}
.certholder{font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.certname{font-family:var(--serif);font-size:46px;line-height:1.05}
.certwhat{font-size:14px;color:var(--body)}
.certfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.certfields div{padding:10px 12px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);min-width:0}
.certfields i{display:block;font-style:normal;font-size:9px;font-weight:700;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.certfields b{font-size:14px;overflow-wrap:anywhere}
.certrights{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 16px;font-size:13px}
.certrights div::before{content:'✓ ';color:var(--emerald);font-weight:700}
.certfoot{font-size:12px;color:var(--body);line-height:1.5}
.certhash{font-family:ui-monospace,Menlo,monospace;font-size:11px;overflow-wrap:anywhere}
.certactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ghost{border:1px solid var(--line2);background:var(--white);border-radius:9999px;padding:8px 16px;font-weight:600;cursor:pointer}
.supportpanel{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}
.support{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.supportline{display:flex;gap:8px;align-items:center}
.supportline input{width:120px;border:1px solid var(--line2);border-radius:9999px;padding:8px 12px}
.supportline select{width:auto;padding:8px 14px}
.protect{flex-direction:row;align-items:flex-start;gap:12px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:15px;color:inherit;margin:10px 0 0}
.protect input{margin-top:4px;accent-color:var(--ink)}
.rates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.rates i{display:block;font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
.rates b{font-size:14px}
.flag{margin-top:8px;font-size:13px;color:var(--rose);font-weight:600}
.supportline{flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.kitrow{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);margin:0;cursor:pointer;text-transform:none;letter-spacing:0;font-size:15px;font-weight:400;color:inherit}
.kitrow:first-of-type{border-top:0}
.kitrow input{width:20px;height:20px;margin-top:3px;accent-color:var(--ink);flex:none}
.kitrow .kitbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.kitrow .kitname{font-weight:600;font-size:16px}
.kitrow .kitname span{font-weight:400;color:var(--muted);font-size:14px}
.kitrow .kitpow{font-size:13px;color:var(--muted)}
.kitrow .kitdoes{font-size:14px;color:var(--body)}
.kitlinks{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.kitlinks a{color:var(--ink);font-weight:600}
.kitalso{font-size:12px;color:var(--label)}
.kittop{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.kitsign{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
input.kitname{width:100%;border:1px solid var(--line2);border-radius:9999px;padding:11px 16px;background:var(--white)}
@media print{.bar,.strip,main>*:not(.printing),footer{display:none!important}.printing{display:block!important}body{background:#fff}}
@media (max-width:560px){.cert{padding:22px 18px}.certname{font-size:32px}}
</style>
</head>
<body>
<div class="bar"><span class="logo">m5bank</span><span class="sub">/ IAM · free</span></div>
<div class="strip">Free forever · runs on this computer only · nothing leaves it</div>
<main id="main"><p class="lede">Opening your IAM…</p></main>
<script>
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const main = document.getElementById('main');
let state = null;
let shownCert = null;

async function sha256(text) {
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function certificate(c) {
  const wrap = el('div', 'certwrap'), frame = el('div', 'certframe'), cert = el('div', 'cert');
  frame.style.setProperty('--accent', c.accent);
  const head = el('div', 'certhead'), org = el('div', 'certorg', 'TITLECHAIN REGISTRY');
  org.append(el('span', null, c.registry));
  const stamp = el('div', 'stamp'); stamp.append(el('b', null, 'SAMPLE'), el('span', null, 'NOT ISSUED · NOT ANCHORED'));
  const no = el('div', 'titleno'); no.append(el('div', null, 'TITLE NO.'), el('b', null, c.titleNo));
  head.append(org, stamp, no);
  const mid = el('div', 'certmid');
  mid.append(el('div', 'certkind', 'CERTIFICATE OF TITLE'), el('div', 'certbar'), el('div', 'certby', c.by),
    el('div', 'certholder', c.holder), el('div', 'certname', c.name), el('div', 'certwhat', c.what));
  const fields = el('div', 'certfields');
  c.fields.forEach(([k, v]) => { const d = el('div'); d.append(el('i', null, k), el('b', null, v)); fields.append(d); });
  const rights = el('div', 'certrights'); c.rights.forEach(r => rights.append(el('div', null, r)));
  cert.append(head, mid, fields, el('div', 'certkind', c.rightsTitle), rights, el('div', 'certfoot', c.foot));
  if (c.hash) cert.append(el('div', 'certhash', c.hashLabel + ' ' + c.hash));
  frame.append(cert); wrap.append(frame);
  return wrap;
}

const COPYLEFT = /GPL|AGPL|MPL|LGPL/;
function toolCertificate(item, r, hash) {
  const copyleft = COPYLEFT.test(item.license);
  return {
    accent: '#047857', registry: 'M5 FREEDOM OFFICE · SOFTWARE LICENSE', titleNo: 'SAMPLE-SW-' + hash.slice(0, 8).toUpperCase(),
    by: 'This certifies that the software below is held under its published license by',
    holder: (r.display_name || 'IAM holder') + ' · ' + r.account_sku, name: item.name, what: item.does,
    fields: [['License', item.license], ['Kind', 'Open source'], ['Cost to you', '$0'], ['Publisher', item.url.replace(/^https:\/\//, '').replace(/\/$/, '')],
      ['Version', 'Recorded when you install'], ['Status', 'Sample · not issued']],
    rightsTitle: 'RIGHTS YOU HOLD UNDER ' + item.license,
    rights: ['Use it for any purpose', 'Study how it works', 'Change it', 'Share copies'],
    foot: (copyleft ? 'If you share a changed version, share it under the same license. ' : '') +
      'The license is granted by the people who make this software, under its public terms. This certificate records it; it does not grant it.',
    hashLabel: 'SHA-256 of this certificate:', hash
  };
}

function serviceCertificate(r, hash) {
  return {
    accent: '#E11D48', registry: 'M5-OPENAPI · LICENSED SERVICE', titleNo: 'SAMPLE-SVC-' + hash.slice(0, 8).toUpperCase(),
    by: 'This certifies that the paid service below is licensed from its provider to',
    holder: (r.display_name || 'IAM holder') + ' · ' + r.account_sku, name: 'Element plan', what: 'Private Matrix server and private rooms',
    fields: [['Provider', 'Element'], ['Price', '$4 per user a month'], ['Paid to', 'The provider, directly'], ['Through', 'M5-OpenAPI'],
      ['Term', '1 year from purchase'], ['Status', 'Sample · not purchased']],
    rightsTitle: 'WHAT THE LICENSE GIVES YOU',
    rights: ['Use the service under the provider\'s terms', 'Keep your rooms and history', 'Talk to the M5 network', 'Cancel under the provider\'s terms'],
    foot: 'Already a customer? Show proof of the plan you hold and the certificate is issued for it. New customer? Pay the provider directly through M5-OpenAPI, then receive the certificate. The provider grants the license; this certificate records it.',
    hashLabel: 'SHA-256 of this certificate:', hash
  };
}

async function showCertificate(kind, item) {
  const r = state.record;
  const seed = JSON.stringify({ kind, item: item ? item.name : null, holder: r.display_name, local_id: r.local_id });
  const hash = await sha256(seed);
  shownCert = kind === 'service' ? serviceCertificate(r, hash) : toolCertificate(item, r, hash);
  shownCert.kind = kind; shownCert.item = item;
  render();
  document.getElementById('certview').scrollIntoView({ behavior: 'smooth' });
}

function certView() {
  const box = el('div', 'card'); box.id = 'certview';
  box.append(el('h2', null, 'Sample certificate'));
  box.append(certificate(shownCert));
  const actions = el('div', 'certactions');
  const print = el('button', 'ghost', 'Print'); print.type = 'button';
  print.addEventListener('click', () => { box.classList.add('printing'); window.print(); box.classList.remove('printing'); });
  const close = el('button', 'ghost', 'Close'); close.type = 'button';
  close.addEventListener('click', () => { shownCert = null; render(); });
  actions.append(print, close);
  box.append(actions);
  if (shownCert.kind === 'tool' || shownCert.kind === 'kit') box.append(supportPanel(shownCert.item));
  if (shownCert.kind === 'service') box.append(protectionPanel());
  return box;
}

// Optional support: never required, never split, stopped at any time. Sample only.
const PER_MONTH = { hour: 730, day: 30.4, week: 4.35, month: 1, year: 1 / 12, once: 0 };
const support = {};
function supportRow(key, title, payee, note) {
  const row = el('div', 'support');
  const head = el('div'); head.append(el('b', null, title), el('div', 'note', payee));
  const saved = support[key] || {};
  const amount = el('input'); amount.type = 'number'; amount.min = '0'; amount.step = '0.01'; amount.placeholder = '0.00';
  amount.value = saved.amount || ''; amount.setAttribute('aria-label', title + ' amount in US dollars');
  const pick = (label, options, value) => {
    const sel = el('select'); sel.setAttribute('aria-label', title + ' ' + label);
    options.forEach(([v, t]) => sel.append(new Option(t, v))); sel.value = value; return sel;
  };
  const every = pick('how often', [['once', 'One time'], ['hour', 'Per hour'], ['day', 'Per day'], ['week', 'Per week'], ['month', 'Per month'], ['year', 'Per year']], saved.every || 'month');
  const term = pick('for how long', [['1', 'for 1 month'], ['3', 'for 3 months'], ['6', 'for 6 months'], ['12', 'for 12 months']], saved.term || '12');
  const rail = pick('pay with', [['stable', 'Stablecoin'], ['crypto', 'Other crypto you hold']], saved.rail || 'stable');
  const line = el('div', 'supportline'); line.append(el('span', null, '$'), amount, every, term, rail);
  const out = el('div', 'note');
  const update = () => {
    support[key] = { amount: amount.value, every: every.value, term: term.value, rail: rail.value };
    term.style.display = every.value === 'once' ? 'none' : '';
    const a = parseFloat(amount.value) || 0, months = parseInt(term.value, 10);
    const total = every.value === 'once' ? a : a * PER_MONTH[every.value] * months;
    out.textContent = !a ? note : (every.value === 'once'
      ? '$' + a.toFixed(2) + ' once, paid on-chain.'
      : '$' + a.toFixed(2) + ' ' + every.selectedOptions[0].text.toLowerCase() + ' ' + term.selectedOptions[0].text +
        ': $' + total.toFixed(2) + ' committed in total. A binding commitment for the term you chose.');
  };
  [amount, every, term, rail].forEach(i => i.addEventListener(i === amount ? 'input' : 'change', update)); update();
  row.append(head, line, out);
  return row;
}
// Optional purchase protection. Sample providers, sorted by price, no favourites.
const PROTECTION = [
  { name: 'No added protection', kind: '', rate: 0, zip: 0, median: 0 },
  { name: 'Card purchase protection', kind: 'Provider A · card network', rate: 1.5, zip: 1.5, median: 1.6 },
  { name: 'Purchase insurance', kind: 'Provider B · independent insurer', rate: 2.1, zip: 3.9, median: 2.2 },
];
function protectionPanel() {
  const panel = el('div', 'supportpanel');
  panel.append(el('div', 'group', 'Optional purchase protection · sample · no value moves'),
    el('p', 'note', 'An added option for some purchases. Credentialed providers only, sorted by price.'));
  const zip = '90221';
  PROTECTION.forEach((p, i) => {
    const row = el('label', 'support protect');
    const radio = el('input'); radio.type = 'radio'; radio.name = 'protection'; radio.checked = i === 0;
    const body = el('div'); body.append(el('b', null, p.name));
    if (p.kind) {
      body.append(el('div', 'note', p.kind + ' · M5-VC credentialed'));
      const grid = el('div', 'rates');
      [['Fee', p.rate.toFixed(1) + '%'], ['Charged in ZIP ' + zip, p.zip.toFixed(1) + '%'], ['Commons median, ZIP ' + zip, p.median.toFixed(1) + '%']]
        .forEach(([k, v]) => { const c = el('div'); c.append(el('i', null, k), el('b', null, v)); grid.append(c); });
      body.append(grid);
      if (p.zip > p.median * 1.25) body.append(el('div', 'flag', 'Charges this ZIP well above the commons median.'));
    } else {
      body.append(el('div', 'note', 'You rely on the provider\'s own terms.'));
    }
    row.append(radio, body); panel.append(row);
  });
  panel.append(el('p', 'note', 'Providers, rates and ZIP are samples.'));
  return panel;
}

function supportPanel(item) {
  const panel = el('div', 'supportpanel');
  panel.append(el('div', 'group', 'Optional support · sample · no value moves'),
    el('p', 'note', item.name + ' stays free whether or not you give. Your gift goes in full to whom you choose.'));
  panel.append(supportRow('dev:' + item.name, 'Support the people who make ' + item.name,
    'Paid directly to the verified developers.',
    'Any amount, any schedule.'));
  panel.append(supportRow('tc', 'Pay it forward to TitleChain Foundation',
    'Goes to the TitleChain Sovereign Purpose Trust to fund new commons projects.',
    'Off unless you choose it.'));
  panel.append(el('p', 'note', 'Paid on-chain, with a receipt for every payment. Giving opens at launch.'));
  return panel;
}

function cell(k, v, n) { const c = el('div', 'cell'); c.append(el('div', 'k', k), el('div', 'v', v)); if (n) c.append(el('div', 'n', n)); return c; }

// CYRUS Protocol: accepting it is required, because it is what protects the holder.
function cyrusBox() {
  const c = state.cyrus, box = el('div', 'terms');
  box.append(el('b', null, c.name + ' · held by the ' + c.held_by));
  const list = el('ul'); list.style.margin = '8px 0 0';
  c.basic_rights.forEach(r => list.append(el('li', null, r)));
  list.append(el('li', null, 'Your rights to ' + c.sovereign_rights.join(', ').toLowerCase().replace(/, ([^,]*)$/, ' and $1')));
  list.append(el('li', null, c.grants + ' — selected by you, activated when your credentials are verified'));
  box.append(list);
  return box;
}
function refusalStatus(r) {
  return r.selected ? 'Selected · not activated' : 'Not selected';
}

function formView() {
  const head = el('div');
  const h = el('h1'); h.append('Activate ', el('em', null, 'your'), ' IAM.');
  head.append(el('div', 'eyebrow', 'Step 1 of 1 · free'), h,
    el('p', 'lede', 'One short statement, in your own name: I am attesting to my humanity. That is all it takes to start. No account to open, nothing to pay, and nothing is sent anywhere.'));
  const card = el('form', 'card');
  const name = el('input'); name.type = 'text'; name.id = 'name'; name.maxLength = 80; name.autocomplete = 'name'; name.placeholder = 'The name you want on your IAM';
  const chain = el('select'); chain.id = 'chain';
  chain.append(new Option('Choose your state chain', ''));
  state.catalog.chains.forEach(c => chain.append(new Option(c.name + ' · ' + c.chain, c.chain)));
  const contact = el('input'); contact.type = 'text'; contact.id = 'contact'; contact.maxLength = 120; contact.placeholder = 'Email or mobile number';
  const l1 = el('label', null, 'Your name'); l1.htmlFor = 'name';
  const l2 = el('label', null, 'Your state chain '); l2.htmlFor = 'chain'; l2.append(el('small', null, 'your own choice, not verified'));
  const l3 = el('label', null, 'How to reach you '); l3.htmlFor = 'contact'; l3.append(el('small', null, 'optional, stays on this computer'));
  const terms = el('div', 'terms');
  const fill = () => {
    const text = state.terms_template.replace('{name}', name.value.trim() || '(your name)')
      .replace('{chain}', chain.value || '(your state chain)').replace('{now}', 'the moment you activate');
    const paras = text.trim().split(/\n\s*\n/).map(p => p.replace(/\n/g, ' ').trim());
    terms.replaceChildren(el('b', null, paras[0].replace(/^# /, '')), document.createTextNode(paras.slice(1).join('\n\n')));
  };
  const box = el('input'); box.type = 'checkbox'; box.id = 'attest';
  const attest = el('label', 'attest'); attest.htmlFor = 'attest'; attest.style.cssText = 'text-transform:none;letter-spacing:0;color:inherit';
  attest.append(box, el('span', null, 'I am attesting to my humanity. I am a human being.'));
  const l4 = el('label', null, 'The CYRUS Protocol '); l4.append(el('small', null, 'required · it protects you'));
  const cyrus = el('input'); cyrus.type = 'checkbox'; cyrus.id = 'cyrus';
  const cyrusLabel = el('label', 'attest'); cyrusLabel.htmlFor = 'cyrus'; cyrusLabel.style.cssText = 'text-transform:none;letter-spacing:0;color:inherit';
  cyrusLabel.append(cyrus, el('span', null, 'I accept the CYRUS Protocol.'));
  const refuse = el('input'); refuse.type = 'checkbox'; refuse.id = 'refuse';
  const refuseLabel = el('label', 'attest'); refuseLabel.htmlFor = 'refuse'; refuseLabel.style.cssText = 'text-transform:none;letter-spacing:0;color:inherit;font-weight:400;font-size:15px';
  const refuseText = el('span'); refuseText.append(el('b', null, 'I select my right to refuse consent. '), document.createTextNode('Not activated yet. It activates ' + state.refusal_activates.charAt(0).toLowerCase() + state.refusal_activates.slice(1)));
  refuseLabel.append(refuse, refuseText);
  const button = el('button', 'btn', 'Activate my IAM'); button.type = 'submit'; button.disabled = true;
  const error = el('p', 'error');
  const ready = () => { button.disabled = !(box.checked && cyrus.checked && name.value.trim() && chain.value); };
  [name, chain].forEach(i => i.addEventListener('input', () => { fill(); ready(); }));
  box.addEventListener('change', ready); cyrus.addEventListener('change', ready);
  card.addEventListener('submit', async event => {
    event.preventDefault();
    button.disabled = true; error.textContent = '';
    try {
      const response = await fetch('/api/attest', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name.value, chain: chain.value, contact: contact.value, attest: box.checked, accept_cyrus: cyrus.checked, right_to_refuse: refuse.checked }) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Something went wrong.');
      state = data; render();
      window.scrollTo(0, 0);
    } catch (problem) { error.textContent = problem.message; ready(); }
  });
  card.append(l1, name, l2, chain, l3, contact, terms, l4, cyrusBox(), cyrusLabel, refuseLabel, attest, button, error);
  fill();
  return [head, card];
}

// Free starter kit: pick, sign and accept, then sample certificates saved in the pod.
let kitEditing = false;
const kitPicked = new Set();
function poweredBy(components) {
  return components.map(p => p.name + ' ' + p.version + ' (' + p.license + ')').join(' + ');
}
function kitCertificateView(c, note) {
  const short = u => u.replace(/^https:\/\/(www\.)?/, '').replace(/^github\.com\//, '').replace(/\/$/, '');
  return {
    accent: '#047857', registry: 'M5 FREEDOM OFFICE · SOFTWARE LICENSE', titleNo: c.title_no,
    by: 'This certifies that the software below is held under its published licence by',
    holder: c.holder + ' · ' + c.account, name: c.m5_tool, what: 'Powered by ' + c.powered_by.map(p => p.name + ' ' + p.version).join(' + '),
    fields: [['Licence', c.licences.join(' + ')], ['Kind', c.kind], ['Cost to you', '$0'],
      ['Job', c.job], ['Source', c.powered_by.map(p => short(p.source).split('/').pop()).join(' + ')],
      ['Accepted', new Date(c.accepted_at).toLocaleDateString()], ['Registry', 'Simulated · not anchored'], ['Status', 'Sample · not issued']],
    rightsTitle: 'RIGHTS YOU HOLD UNDER ' + c.licences.join(' + '), rights: c.rights,
    foot: (c.share_alike ? 'If you share a changed version, share it under the same licence. ' : '') + c.licence_note + ' ' + note,
    hashLabel: 'SHA-256 of this certificate:', hash: c.certificate_sha256
  };
}
function showKitCertificate(c) {
  shownCert = kitCertificateView(c, state.catalog.starter_kit.names_note);
  shownCert.kind = 'kit'; shownCert.item = { name: c.powered_by[0].name };
  render();
  document.getElementById('certview').scrollIntoView({ behavior: 'smooth' });
}
function kitCard() {
  const kit = state.catalog.starter_kit, saved = state.kit;
  const card = el('div', 'card'); card.id = 'kit';
  if (saved && !kitEditing) {
    const k = saved.record;
    const top = el('div', 'kittop'); top.append(el('h2', null, kit.title), el('span', 'pill on', 'Accepted · saved in your pod'));
    card.append(top, el('p', 'note', 'Signed by ' + k.signed_by + ' on ' + new Date(k.accepted_at).toLocaleString() +
      '. A typed name, not a cryptographic signature. Each certificate is a sample until the TitleChain Registry issues real ones at launch.'));
    saved.certificates.forEach(c => {
      const row = el('div', 'row'), left = el('div');
      left.append(el('b', null, c.m5_tool), document.createTextNode(' '), el('span', null, 'Powered by ' + poweredBy(c.powered_by)));
      const right = el('div', 'r'); right.append(document.createTextNode(c.title_no + ' · '));
      const b = el('button', 'linkbtn', 'View certificate'); b.type = 'button'; b.addEventListener('click', () => showKitCertificate(c));
      right.append(b); row.append(left, right); card.append(row);
    });
    card.append(el('p', 'mono', state.pod_path + '/' + 'M0-M5IAM-000/' + 'software/kit-record.json'));
    const change = el('button', 'ghost', 'Change my kit'); change.type = 'button';
    change.addEventListener('click', () => { kitEditing = true; kitPicked.clear(); k.tools.forEach(t => kitPicked.add(t.id)); render(); document.getElementById('kit').scrollIntoView(); });
    const actions = el('div', 'certactions'); actions.append(change); card.append(actions);
    card.append(el('p', 'note', kit.names_note));
    return card;
  }
  const top = el('div', 'kittop'); top.append(el('h2', null, kit.title));
  const all = el('button', 'linkbtn', 'Select all'); all.type = 'button';
  top.append(all);
  card.append(top, el('p', 'note', 'Pick a free tool for each everyday job. Download each one from its official source. Then sign and accept: your kit record and a sample certificate for each tool are saved in your pod. Versions checked ' + kit.versions_checked + '.'));
  const boxes = [];
  kit.tools.forEach(t => {
    const row = el('label', 'kitrow'), box = el('input'); box.type = 'checkbox'; box.checked = kitPicked.has(t.id);
    box.addEventListener('change', () => { box.checked ? kitPicked.add(t.id) : kitPicked.delete(t.id); fill(); });
    boxes.push([box, t]);
    const body = el('div', 'kitbody'), name = el('div', 'kitname', t.m5_name + ' ');
    name.append(el('span', null, '· ' + t.job));
    const links = el('div', 'kitlinks');
    t.components.forEach(p => { const a = el('a', null, 'Download ' + p.name); a.href = p.download; a.target = '_blank'; a.rel = 'noopener noreferrer'; links.append(a); });
    if (t.setup_help) links.append(el('span', 'pill pending', 'You may want help setting this up'));
    body.append(name, el('div', 'kitpow', 'Powered by ' + poweredBy(t.components)), el('div', 'kitdoes', t.does), links);
    if (t.also) body.append(el('div', 'kitalso', 'Also free: ' + t.also));
    row.append(box, body); card.append(row);
  });
  all.addEventListener('click', () => { boxes.forEach(([b, t]) => { b.checked = true; kitPicked.add(t.id); }); fill(); });

  const sign = el('form', 'kitsign');
  const terms = el('div', 'terms');
  const l1 = el('label', null, 'Your name, as your signature '); l1.htmlFor = 'kitname'; l1.append(el('small', null, 'stays on this computer'));
  const name = el('input', 'kitname'); name.type = 'text'; name.id = 'kitname'; name.maxLength = 80; name.autocomplete = 'name';
  name.value = state.record.display_name || '';
  const acks = ['I download each tool from its official source, listed above.',
    'I accept each tool’s licence as published by the people who make it. The certificate records the licence; it does not grant it.',
    'My records stay mine, in this pod.'].map((text, i) => {
    const box = el('input'); box.type = 'checkbox'; box.id = 'kitack' + i;
    const label = el('label', 'attest'); label.htmlFor = box.id; label.style.cssText = 'text-transform:none;letter-spacing:0;color:inherit;font-weight:400;font-size:15px';
    label.append(box, el('span', null, text)); return [box, label];
  });
  const button = el('button', 'btn', 'Sign and save to my pod'); button.type = 'submit';
  const error = el('p', 'error');
  const fill = () => {
    const chosen = kit.tools.filter(t => kitPicked.has(t.id));
    terms.replaceChildren(el('b', null, chosen.length ? 'You accept ' + chosen.length + (chosen.length === 1 ? ' tool' : ' tools') : 'Pick at least one tool above'),
      document.createTextNode(chosen.map(t => t.m5_name + ': ' + poweredBy(t.components)).join('\n')));
    button.disabled = !(chosen.length && name.value.trim() && acks.every(([b]) => b.checked));
  };
  name.addEventListener('input', fill); acks.forEach(([b]) => b.addEventListener('change', fill));
  sign.addEventListener('submit', async event => {
    event.preventDefault(); button.disabled = true; error.textContent = '';
    try {
      const response = await fetch('/api/kit', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tools: [...kitPicked], name: name.value, accept: acks.every(([b]) => b.checked) }) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Something went wrong.');
      state = data; kitEditing = false; shownCert = null; render();
      document.getElementById('kit').scrollIntoView();
    } catch (problem) { error.textContent = problem.message; fill(); }
  });
  sign.append(el('div', 'group', 'Sign and accept'), terms, l1, name, ...acks.map(([, l]) => l), button, error);
  if (saved) {
    const cancel = el('button', 'ghost', 'Keep my current kit'); cancel.type = 'button'; cancel.style.marginLeft = '8px';
    cancel.addEventListener('click', () => { kitEditing = false; render(); });
    sign.append(cancel);
  }
  card.append(sign, el('p', 'note', kit.names_note));
  fill();
  return card;
}

    left.append(el('b', null, 'Right to refuse consent'), document.createTextNode(' '), el('span', null, r.selected ? r.why_not_active + ' It activates ' + r.activates.charAt(0).toLowerCase() + r.activates.slice(1) : 'You can select it at any time.'));

        const data = await response.json();

  const not = el('div', 'card');

      rightsTitle: 'WHAT YOUR IAM GIVES YOU', rights: c.rights, foot: c.limits + ' ' + c.usage.transfer + ' Your records: ' + c.commons.your_records,
      hashLabel: 'Registry commitment:', hash: c.registry_commitment_sha256 }));
  }
  const parts = [head, have];
  if (state.consent) parts.push(consent);
  if (reg) parts.push(chainCard);
  if (c) parts.push(iamCert);
  if (state.catalog.starter_kit) parts.push(kitCard());
  if (shownCert) parts.push(certView());
  return parts.concat([use, later, rep, not]);
}

function render() {
  main.replaceChildren(...(state.record ? resultView() : formView()),
    el('footer', null, 'This page runs on this computer only. It loads nothing from the network and sends nothing anywhere. Published by TitleChain Foundation as a draft for public review.'));
}

fetch('/api/state', { cache: 'no-store' }).then(r => r.json()).then(data => { state = data; render(); })
  .catch(() => { main.replaceChildren(el('p', 'lede', 'M5 IAM has stopped. Open it again to continue.')); });
