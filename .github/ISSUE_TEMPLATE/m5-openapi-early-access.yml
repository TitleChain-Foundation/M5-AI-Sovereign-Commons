name: M5 OpenAPI early-access interest
description: Tell us which public-safe M5/SHADOW capability you would test. Do not submit confidential or personal data.
title: "[M5 OpenAPI] "
body:
  - type: markdown
    attributes:
      value: |
        This is a public demand/research intake form, not a contract, production credential, investment offer, or promise of service.

        Do not post private M5POD records, API secrets, wallet keys, customer PII, confidential deal data, or vulnerability details.
  - type: dropdown
    id: role
    attributes:
      label: Professional lane
      options:
        - Banking / lending / credit
        - Commercial real estate / title / escrow
        - Farmland / agriculture
        - Accounting / audit / fiduciary
        - Securities / transfer agency / asset management
        - Developer / data / AI
        - Government / public sector
        - Research / academia
        - Other
    validations:
      required: true
  - type: dropdown
    id: product
    attributes:
      label: Which capability would you test first?
      options:
        - Asset State
        - Evidence Bundle
        - Debt / Encumbrance Research
        - Change Events / Webhooks
        - SHADOW Derived Research
        - M5Canon Evaluation
        - Intelligence Router / Local Laya
        - Other
    validations:
      required: true
  - type: input
    id: sector
    attributes:
      label: Asset sector / use case
    validations:
      required: true
  - type: input
    id: geography
    attributes:
      label: Geography / jurisdiction
  - type: dropdown
    id: volume
    attributes:
      label: Expected monthly requests
      options:
        - Under 1,000
        - 1,000–10,000
        - 10,000–100,000
        - 100,000–1,000,000
        - Over 1,000,000
        - Not sure yet
  - type: checkboxes
    id: needs
    attributes:
      label: Integration needs
      options:
        - label: Bulk / history
        - label: Webhooks / change events
        - label: Provenance / evidence links
        - label: Local Laya / sovereign compute
        - label: Hosted System 1 scale
        - label: Usage-based billing
        - label: x402 machine payment
        - label: Enterprise contract / invoice
  - type: dropdown
    id: paid
    attributes:
      label: Would you consider a paid design-partner pilot if the capability fits?
      options:
        - "Yes"
        - "Maybe — need scope/pricing"
        - "No — research/free use only"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What result would make this useful?
      description: Keep this public and non-confidential.
    validations:
      required: true
