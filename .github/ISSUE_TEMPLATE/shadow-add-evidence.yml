name: SHADOW — Add evidence
description: Add a public record or source to an existing SHADOW asset.
title: "[SHADOW EVIDENCE] "
labels: ["shadow", "submission", "evidence"]
body:
  - type: input
    id: asset_id
    attributes:
      label: Asset ID
      placeholder: SHD-029
    validations:
      required: true
  - type: dropdown
    id: evidence_type
    attributes:
      label: Evidence type
      options:
        - Deed / title
        - Parcel / assessor
        - Mortgage / deed of trust
        - Assignment
        - Release / satisfaction
        - Easement / right-of-way
        - Water / mineral / pipeline right
        - Environmental record
        - Auction / disposition
        - Ownership / entity
        - Planning / zoning
        - Debt / servicing
        - Other
    validations:
      required: true
  - type: input
    id: source_office
    attributes:
      label: Source office / agency
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Source URL
    validations:
      required: true
  - type: input
    id: instrument
    attributes:
      label: Instrument / record number
  - type: input
    id: record_date
    attributes:
      label: Recorded / effective date
  - type: textarea
    id: claim
    attributes:
      label: What does this evidence establish?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / file reference
