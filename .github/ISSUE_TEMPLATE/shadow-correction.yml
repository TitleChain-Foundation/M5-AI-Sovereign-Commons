name: SHADOW — Correct a record
description: Challenge or correct a field using supporting public evidence.
title: "[SHADOW CORRECTION] "
labels: ["shadow", "submission", "correction"]
body:
  - type: input
    id: asset_id
    attributes:
      label: Asset ID
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: Field being challenged
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current value / statement
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Supporting source URL
    validations:
      required: true
