name: SHADOW Validate
on:
  pull_request:
    paths:
      - "shadow-m5index/**"
      - ".github/ISSUE_TEMPLATE/shadow-*.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pytest qrcode[pil]
      - run: python shadow-m5index/scripts/validate_records.py
      - run: pytest -q shadow-m5index/tests
