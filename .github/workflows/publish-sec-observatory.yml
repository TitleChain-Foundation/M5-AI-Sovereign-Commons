name: Publish SEC comment observatory

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-sec-observatory.yml"
      - "sec-public-input/observatory/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sec-public-input/observatory/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r sec-public-input/observatory/requirements.txt

      - name: Test observatory
        run: python -m unittest discover -s sec-public-input/observatory/tests -v

      - name: Refresh official SEC index and build public site
        run: |
          python sec-public-input/observatory/update_observatory.py \
            --output _site/sec-observatory \
            --previous-feed "https://titlechain-foundation.github.io/M5-AI-Sovereign-Commons/sec-observatory/feed.json"
          cp sec-public-input/observatory/pages-index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
