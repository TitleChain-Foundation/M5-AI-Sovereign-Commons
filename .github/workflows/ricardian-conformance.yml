name: Ricardian conformance

on:
  pull_request:
    paths:
      - ".github/workflows/ricardian-conformance.yml"
      - "pilots/312-spring-commons/**"
      - "standards/M5-RICARDIAN-TRIPLE-LAYER-001.md"
      - "tests/test_m5_ricardian_settlement.py"
      - "requirements-dev.txt"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ricardian-conformance.yml"
      - "pilots/312-spring-commons/**"
      - "standards/M5-RICARDIAN-TRIPLE-LAYER-001.md"
      - "tests/test_m5_ricardian_settlement.py"
      - "requirements-dev.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      M5_REQUIRE_NUMSCRIPT: "1"
      NUMSCRIPT_VERSION: "0.0.25"
      NUMSCRIPT_ASSET: "numscript_0.0.25_Linux_x86_64.tar.gz"
      NUMSCRIPT_SHA256: "134e9cc3c42af0d642c4a3b4cb3c644b1028f09cde100013073c7efa36dfb0f5"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install checksum-verified Numscript
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$NUMSCRIPT_ASSET" \
            "https://github.com/formancehq/numscript/releases/download/v$NUMSCRIPT_VERSION/$NUMSCRIPT_ASSET"
          echo "$NUMSCRIPT_SHA256  $RUNNER_TEMP/$NUMSCRIPT_ASSET" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$NUMSCRIPT_ASSET" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run Ricardian conformance tests
        run: python -m pytest -q tests/test_m5_ricardian_settlement.py
