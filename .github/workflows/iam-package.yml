name: M5 IAM Free package
on:
  push:
    tags: ['m5-iam-free-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: python tools/build_iam_package.py --output-dir dist
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: test -f "dist/${GITHUB_REF_NAME}.zip"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: m5-iam-free-package
          path: dist/
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --title "M5 IAM Free ${GITHUB_REF_NAME#m5-iam-free-}" \
            --notes "Downloadable free M5 IAM starting pod. Unregistered commons starter: self-attested, not a verified identity, a TCID, an M5 Bank account or a licensed M5POD. See m5-pod/iam-free/M5IAM-FREE-PACKAGE.md."
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 --clobber
